name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the statuary pilot reads the mixed package as it was before (OLD_REF)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: every archive, with the one validator of the EM tools
        run: python tools/validate.py
      - run: pytest -q
