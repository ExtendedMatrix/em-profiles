schema_version = "1.0.0"
id = "geofisica"
version = "0.1.0"
name = "Geofisica"
tagline = "Geophysical slices as documents: GPR, ERT and more"
maintainer = "Emanuel Demetrescu (CNR-ISPC)"
license = ["SPDX:CC-BY-4.0", "SPDX:GPL-3.0-or-later"]
em_api_min = "1.2"
