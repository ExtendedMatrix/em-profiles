[code]
version = "0.1.0"
root = "code/"
license = "SPDX:GPL-3.0-or-later"
entry = "geofisica:plugin"
hosts = ["emstudio", "blender"]
  [code.permissions]
  files = "Reads the chosen geophysical stacks and writes their slice cache"
  [code.descriptor]
  host = "emstudio-side"
  transport = ["direct"]
  capabilities = ["read-graph"]
  provenance = "derivation"
