  [[data.vocabularies]]
  path = "vocab/metodi.ttl"
  scheme = "https://w3id.org/extendedmatrix/profile/geofisica/vocab/metodi/"
  version = "0.1.0"
  license = "SPDX:CC-BY-4.0"
  fascia = "A"
  digest = "sha256:973912f6dd1a82aff9859acf8a93944fe686f7024d8c66eed3cefd3d16172e60"
  [[data.vocabularies]]
  path = "vocab/grandezze.ttl"
